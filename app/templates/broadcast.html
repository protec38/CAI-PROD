<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>Envoyer une alerte ou un message</title><link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='features.css') }}"></head><body class="cai-tools"><main class="feature-page"><a href="{{ url_for('main_bp.evenement_new') }}">← Menu principal</a><h1>Envoyer une alerte ou un message</h1><p>Le message sera affiché à tous les utilisateurs connectés.</p><form class="feature-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Message<textarea name="message" rows="6" maxlength="280" required placeholder="Saisissez le message à diffuser…"></textarea></label><div class="feature-grid"><label>Symbole<select name="emoji">{% for emoji in broadcast_emojis %}<option value="{{ emoji }}" {% if emoji == default_emoji %}selected{% endif %}>{{ emoji }}</option>{% endfor %}</select></label><label>Niveau d’alerte<select name="level">{% for level in broadcast_levels %}<option value="{{ level }}" {% if level == default_level %}selected{% endif %}>{{ broadcast_level_labels.get(level, level) }}</option>{% endfor %}</select></label></div><p><button class="primary" type="submit">Envoyer à tous les utilisateurs</button></p></form></main>{% include '_device.html' %}</body></html>
