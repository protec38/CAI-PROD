<link rel="stylesheet" href="{{ url_for('static', filename='offline.css') }}">
{% if not offline_mode | default(false) %}
<script id="cai-offline-context" type="application/json">{{ {
  'userId': user.id,
  'eventId': evenement.id,
  'eventName': evenement.nom,
  'numeroPrevu': numero_prevu | default(''),
  'permissions': {
    'canDelete': user.is_admin or user.role | lower in ['codep', 'responsable'],
    'canBagages': user.is_admin or user.role | lower in ['codep', 'responsable', 'technicien']
  },
} | tojson }}</script>
{% endif %}
<script src="{{ url_for('static', filename='offline-store.js') }}"></script>
<script src="{{ url_for('static', filename='offline.js') }}"></script>
