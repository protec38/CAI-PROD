name: Tests and dependencies
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cai_test
          POSTGRES_USER: cai_test
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cai_test -d cai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose without a local .env file
        run: docker compose --env-file /dev/null config --quiet
        env:
          SECRET_KEY: ci-test-only-secret-key
          POSTGRES_PASSWORD: test-only-password
          DATABASE_URL: postgresql+psycopg2://cai:test-only-password@db:5432/cai
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check app manage.py config.py run.py tests --select E9,F63,F7,F82
      - run: python -m pytest -q
      - run: python -m pytest -q
        env:
          CAI_TEST_DATABASE_URL: postgresql+psycopg2://cai_test:test-only-password@localhost:5432/cai_test
      - run: node tests/test_frontend.cjs
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_offline_browser.py tests/test_responsive_browser.py tests/test_features_browser.py tests/test_person_workflows_browser.py -q
        env:
          CAI_BROWSER_TEST: "1"
      - run: python -m pip_audit -r requirements.txt --no-deps --disable-pip
