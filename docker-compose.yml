services:
  redis:
    image: redis:7
    restart: unless-stopped
    networks: [cai-net]

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cai}
      POSTGRES_USER: ${POSTGRES_USER:-cai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - cai-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 50s
      timeout: 30s
      retries: 10
    networks: [cai-net]
    restart: unless-stopped

  web:
    build: .
    environment:
      FLASK_CONFIG: ${FLASK_CONFIG:-prod}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-cai}
      POSTGRES_USER: ${POSTGRES_USER:-cai}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      FORCE_HTTPS: ${FORCE_HTTPS:-1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "5001:5000"
    networks: [cai-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('localhost',5000,timeout=5); c.request('GET','/healthz'); r=c.getresponse(); raise SystemExit(0 if r.status==200 else 1)"]
      interval: 50s
      timeout: 20s
      retries: 3

networks:
  cai-net:

volumes:
  cai-db: {}
