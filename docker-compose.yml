services:
  redis:
    image: redis:7
    restart: unless-stopped
    networks: [cai-net]

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cai-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 50s
      timeout: 30s
      retries: 10
    networks: [cai-net]
    restart: unless-stopped

  web:
    build: .
    env_file: [.env]
    environment:
      FLASK_CONFIG: ${FLASK_CONFIG}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      FORCE_HTTPS: ${FORCE_HTTPS:-1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "5001:5000"
    networks: [cai-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('localhost',5000,timeout=5); c.request('GET','/healthz'); r=c.getresponse(); raise SystemExit(0 if r.status==200 else 1)"]
      interval: 50s
      timeout: 20s
      retries: 3

networks:
  cai-net:

volumes:
  cai-db: {}
